<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round Ventilator - บันทึกข้อมูล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink-900:#C2185B;
  --pink-700:#E0508A;
  --pink-600:#EC6FA0;
  --pink-500:#F48FB6;
  --pink-300:#FBC6DC;
  --pink-100:#FDE6EF;
  --pink-050:#FFF4F9;
  --ink:#5B2340;
  --ink-soft:#8A4B69;
  --border:#F5C9DD;
  --white:#FFFFFF;
  --good:#1E8E5A;
  --bad:#D23F6B;
  --shadow: 0 2px 4px rgba(194,24,91,0.06), 0 10px 28px rgba(194,24,91,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg, var(--pink-050) 0%, #FFFBFD 260px);
  color:var(--ink);
  font-family:'Sarabun', sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
a{color:inherit;}

/* ===== Header ===== */
.header{
  background:linear-gradient(120deg, var(--pink-700) 0%, var(--pink-600) 55%, var(--pink-500) 100%);
  color:#fff;
  padding:30px 24px 60px;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:"";
  position:absolute; left:-40px; bottom:-60px;
  width:220px;height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
}
.header::after{
  content:"";
  position:absolute; right:-30px; top:-50px;
  width:260px;height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%);
}
.header-inner{
  max-width:900px; margin:0 auto; position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:54px;height:54px; border-radius:16px;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.brand h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-0.01em;}
.brand .sub{margin:4px 0 0; font-size:13.5px; color:rgba(255,255,255,0.85); font-weight:500;}
.badge-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.badge-pill{
  font-size:11px; font-weight:700; letter-spacing:0.04em;
  background:rgba(255,255,255,0.2); color:#fff;
  padding:4px 10px; border-radius:20px;
}
.dash-link{
  align-self:flex-start;
  background:#fff; color:var(--pink-900); text-decoration:none;
  font-weight:700; font-size:12.5px;
  padding:9px 16px; border-radius:10px;
  box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:6px;
}
.dash-link:hover{background:var(--pink-100);}

/* ===== Layout ===== */
.wrap{max-width:900px; margin:-32px auto 0; padding:0 24px; position:relative; z-index:2;}
form{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width: 760px){ form{grid-template-columns:1fr;} }
.full{grid-column:1 / -1;}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:20px 22px;
}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.icon-badge{
  width:34px;height:34px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg, var(--pink-600), var(--pink-500));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(224,80,138,0.35);
}
.icon-badge svg{width:18px;height:18px;}
.card-head label{font-size:15px; font-weight:700; color:var(--pink-900);}
.req{color:var(--bad); font-weight:700;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
.opt{
  display:flex; align-items:center; gap:9px;
  font-size:14px; color:var(--ink); cursor:pointer;
  padding:4px 2px;
}
.opt input{width:17px;height:17px; accent-color:var(--pink-700); cursor:pointer; flex-shrink:0;}
.other-input{
  grid-column:1 / -1;
  margin-top:2px;
  width:100%;
  border:1.5px solid var(--border);
  border-radius:9px;
  padding:8px 12px;
  font-family:'Sarabun',sans-serif;
  font-size:13.5px;
  color:var(--ink);
  outline:none;
}
.other-input:focus{border-color:var(--pink-600);}

input[type=text], input[type=date], textarea{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:11px;
  padding:12px 14px;
  font-family:'Sarabun',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  outline:none;
  background:var(--pink-050);
}
input[type=text]:focus, input[type=date]:focus, textarea:focus{
  border-color:var(--pink-600);
  background:#fff;
}
textarea{resize:vertical; min-height:70px;}
::placeholder{color:#C98AA6;}

.actions{
  grid-column:1 / -1;
  display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;
}
.btn{
  border:none; cursor:pointer;
  font-family:'Sarabun',sans-serif; font-weight:700; font-size:15px;
  padding:15px 28px; border-radius:14px;
  display:inline-flex; align-items:center; gap:9px;
}
.btn-submit{
  background:linear-gradient(135deg, var(--pink-700), var(--pink-500));
  color:#fff;
  box-shadow:0 6px 16px rgba(194,24,91,0.35);
}
.btn-submit:hover{filter:brightness(1.04);}
.btn-submit:disabled{opacity:0.6; cursor:default;}
.btn-reset{
  background:#fff; color:var(--pink-700);
  border:1.5px solid var(--pink-500);
}
.btn-reset:hover{background:var(--pink-100);}

.status-msg{
  grid-column:1 / -1;
  border-radius:12px;
  padding:12px 16px;
  font-size:13.5px;
  font-weight:600;
  display:none;
}
.status-msg.show{display:block;}
.status-msg.ok{background:#E8F7EF; color:var(--good); border:1px solid #BFE8D1;}
.status-msg.err{background:#FDECEF; color:var(--bad); border:1px solid #F5C0CD;}

.footer-note{
  max-width:900px; margin:34px auto 0; padding:0 24px;
  text-align:center; color:var(--ink-soft); font-size:12.5px;
}
.footer-note .quote{font-weight:700; color:var(--pink-800); margin-bottom:4px; font-size:13.5px;}

/* ===== Reference-inspired form refresh ===== */
:root{
  --pink-900:#9D174D; --pink-700:#D92770; --pink-600:#EA4D8A;
  --pink-500:#F278A7; --pink-300:#F8BBD3; --pink-100:#FCE8F1;
  --pink-050:#FFF7FB; --ink:#34212C; --ink-soft:#80556A;
  --border:#F0D8E3; --shadow:0 3px 14px rgba(130,48,83,.07);
}
body{background:linear-gradient(135deg,#FFF8FB 0%,#FCEAF2 50%,#FFF9FC 100%);padding-bottom:0}
.header{padding:0;min-height:274px;color:var(--ink);background:linear-gradient(105deg,#F9DDE9 0%,#FFF5F9 48%,#F8D8E6 100%);overflow:hidden}
.header:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 30%,rgba(255,255,255,.9),transparent 33%),radial-gradient(ellipse at 6% 80%,rgba(234,77,138,.11),transparent 35%);width:auto;height:auto;left:0;bottom:0;border-radius:0}
.header:after{content:"";position:absolute;left:-4%;right:-4%;bottom:-39px;top:auto;width:auto;height:78px;border-radius:50%;background:rgba(255,255,255,.68)}
.hero-inner{max-width:1240px;min-height:274px;margin:0 auto;padding:28px 38px 45px;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hero-copy{position:relative;z-index:2}
.hero-kicker{font:700 12px 'IBM Plex Mono',monospace;letter-spacing:.25em;color:#7E5066;margin-bottom:14px}
.hero-kicker b{color:var(--pink-600);padding:0 7px}
.hero-heart{display:inline-grid;place-items:center;background:#E64283;color:#fff;border-radius:50%;width:30px;height:30px;font:700 22px Arial;vertical-align:middle;margin-right:8px;box-shadow:0 5px 12px #e6428340}
.hero-copy h1{font-size:clamp(40px,6vw,68px);line-height:1.05;font-weight:800;letter-spacing:-.035em;color:#34212C;margin:0}
.hero-copy h1 span{color:#D92770}
.hero-tagline{display:inline-block;background:#F6D7E5;color:#861646;padding:8px 24px;border-radius:28px;font-size:clamp(17px,2vw,23px);font-weight:700;margin:12px 0 0}
.hero-tagline span{color:#D92770;margin-left:4px}
.hero-note{font-size:13px;color:#8B6375;letter-spacing:.08em;margin:8px 0 0 10px}
.hero-art{position:absolute;right:9%;top:16px;width:370px;height:235px}
.hero-orbit{position:absolute;border-radius:50%;background:#F8C9DC66}
.orbit-one{width:212px;height:212px;right:20px;top:4px}
.orbit-two{width:120px;height:120px;right:205px;top:95px;background:#fff8}
.monitor{position:absolute;right:4px;bottom:0;width:224px;height:150px;border:8px solid #E6EAF0;border-radius:18px 18px 9px 9px;background:#26354D;box-shadow:0 12px 25px #62213b24}
.monitor-top{height:22px;padding:0 8px;display:flex;gap:4px;align-items:center;background:#F4F6F9;color:#667085;font:700 8px Arial;letter-spacing:.12em}
.monitor-top i{height:6px;width:6px;background:#EA4D8A;border-radius:50%}.monitor-top i:nth-child(2){background:#FFC65A}.monitor-top i:nth-child(3){background:#63CBA9}.monitor-top span{margin-left:auto}
.monitor-screen{width:100%;height:110px;padding:7px 10px}
.monitor-base{position:absolute;bottom:-17px;left:68px;width:74px;height:10px;background:#C8D0DA;border-radius:0 0 8px 8px}
.lung-medallion{position:absolute;right:189px;top:13px;width:136px;height:166px;border-radius:76px;background:linear-gradient(150deg,#fff,#FCE8F1);box-shadow:0 10px 22px #86294d16;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-4deg)}
.lung-medallion svg{width:70px;height:82px}
.lung-medallion span{font-size:12px;font-weight:700;color:#8D1E4A;text-align:center;line-height:1.5}
.floating-heart{position:absolute;color:#EE7FAB;font-size:22px}
.heart-a{top:5px;right:2px}.heart-b{bottom:25px;left:0;font-size:17px}
.dash-link{position:absolute;right:38px;top:24px;z-index:3;border:1px solid #EAC4D4;padding:9px 14px;color:#9D174D;box-shadow:0 3px 10px #852b4a12}
.dash-link:hover{background:#FFF0F6}
.wrap{max-width:1240px;margin:-18px auto 0;padding:0 28px;z-index:2}
form{gap:16px}
.card{border:1px solid #F1DCE6;border-radius:16px;background:rgba(255,255,255,.88);box-shadow:0 4px 16px rgba(126,57,85,.045);padding:20px 22px;transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(126,57,85,.09)}
.card-head{gap:12px;margin-bottom:14px}
.icon-badge{width:50px;height:50px;border-radius:13px;background:linear-gradient(145deg,#F05B98,#D92770);box-shadow:0 4px 10px #d9277030}
.icon-badge svg{width:24px;height:24px}
.card-head label{font-size:18px;color:#3E2431}
.opt-grid{gap:8px 18px}
.opt{font-size:16px;min-height:32px;gap:10px}
.opt input{width:19px;height:19px}
.other-input,input[type=text],input[type=date],textarea{border:1px solid #C9CDD4;border-radius:9px;background:#FBFBFC;padding:13px 15px;font-size:15px;color:#34212C}
.other-input:focus,input[type=text]:focus,input[type=date]:focus,textarea:focus{border-color:#E84B89;box-shadow:0 0 0 3px #E84B8918}
::placeholder{color:#9498A1}
.actions{gap:16px;margin-top:2px;align-items:center}
.btn{min-width:230px;justify-content:center;border-radius:12px;font-size:18px;padding:15px 24px}
.btn-submit{background:linear-gradient(110deg,#E83E82,#CE1E63);box-shadow:0 6px 15px #c2185b30}
.btn-reset{border-color:#E8AAC5;color:#C9276B}
.status-msg{font-size:15px}
.footer-note{max-width:1240px;margin:24px auto 0;padding:20px 28px 22px;border-top:1px solid #f2d4e1;color:#84576c}
.footer-note .quote{color:#8B174A;font-size:15px}
@media(max-width:900px){
  .hero-inner{padding:32px 26px 44px;min-height:256px}
  .hero-art{right:2%;opacity:.55;transform:scale(.84);transform-origin:right center}
  .hero-copy{max-width:70%}
  .dash-link{right:24px;top:18px}
  .wrap{padding:0 18px}
}
@media(max-width:650px){
  .header{min-height:270px}
  .hero-inner{min-height:270px;padding:52px 20px 40px;align-items:flex-start}
  .hero-copy{max-width:100%;padding-top:6px}
  .hero-kicker{font-size:9px;letter-spacing:.12em}
  .hero-copy h1{font-size:42px}
  .hero-tagline{font-size:16px;padding:7px 14px}
  .hero-note{font-size:11px}
  .hero-art{right:-94px;top:77px;opacity:.3;transform:scale(.75);transform-origin:right top}
  .dash-link{right:16px;top:14px;padding:7px 10px;font-size:11px}
  .wrap{padding:0 12px}
  form{grid-template-columns:1fr;gap:12px}
  .card{padding:17px 16px}
  .card-head label{font-size:17px}
  .opt-grid{gap:5px 12px}
  .opt{font-size:15px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .btn{min-width:0;width:100%;font-size:15px;padding:13px 10px}
  .footer-note{padding:18px 16px}
}

/* Exact supplied artwork, displayed as a cropped banner header */
.header.photo-header{position:relative;padding:0;padding-top:27.34%;min-height:0;height:auto;background:#FCEAF2;line-height:0;overflow:hidden}
.header.photo-header::before,.header.photo-header::after{display:none}
.photo-header .banner-image{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.photo-header .dash-link{line-height:1.4;top:18px;right:28px}
@media(max-width:650px){.header.photo-header{padding-top:27.34%}.photo-header .dash-link{top:9px;right:10px;padding:6px 9px;font-size:10px}}

</style>
</head>
<body>

<div class="header photo-header">
  <img class="banner-image" src="assets/round-ventilator-banner.svg" alt="Round Ventilator — ร่วมดูแล เพื่อการหายใจที่ดีกว่า">
  <a href="index.html" class="dash-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    ดูแดชบอร์ด
  </a>
</div>

<div class="wrap">
  <form id="roundForm">

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>หน่วยงาน <span class="req">*</span></label>
      </div>
      <div class="opt-grid" id="wardGroup">
        <label class="opt"><input type="radio" name="ward" value="ICU100" required> ICU100</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลย์ ชาย"> ศัลย์ ชาย</label>
        <label class="opt"><input type="radio" name="ward" value="Semi ICU"> Semi ICU</label>
        <label class="opt"><input type="radio" name="ward" value="Med ชาย"> Med ชาย</label>
        <label class="opt"><input type="radio" name="ward" value="Med ญ"> Med ญ</label>
        <label class="opt"><input type="radio" name="ward" value="กจ3"> กจ3</label>
        <label class="opt"><input type="radio" name="ward" value="EENT"> EENT</label>
        <label class="opt"><input type="radio" name="ward" value="กจ2"> กจ2</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลย์ หญิง"> ศัลย์ หญิง</label>
        <label class="opt"><input type="radio" name="ward" value="TM"> TM</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลยกรรมกระดูก"> ศัลยกรรมกระดูก</label>
        <label class="opt"><input type="radio" name="ward" value="ดบ"> ดบ</label>
        <label class="opt"><input type="radio" name="ward" value="ดล"> ดล</label>
        <label class="opt"><input type="radio" name="ward" value="PICU"> PICU</label>
        <label class="opt"><input type="radio" name="ward" value="__other__"> อื่นๆ:</label>
        <input type="text" class="other-input" id="wardOther" placeholder="ระบุหน่วยงาน">
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 6v13M3 14h18v5M21 14v-2a3 3 0 0 0-3-3h-7v5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="11" r="2" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <label>เตียง <span class="req">*</span></label>
      </div>
      <input type="text" id="bedNo" placeholder="กรอกหมายเลขเตียง" required>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3c-2 3-2 6-2 9a5 5 0 0 0 5 5c1.5 0 2-1 2-2v-8M17 3c2 3 2 6 2 9a5 5 0 0 1-5 5c-1.5 0-2-1-2-2v-1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>เครื่องช่วยหายใจ <span class="req">*</span></label>
      </div>
      <div class="opt-grid" id="ventGroup">
        <label class="opt"><input type="checkbox" name="vent_type" value="C2"> C2</label>
        <label class="opt"><input type="checkbox" name="vent_type" value="Bird"> Bird</label>
        <label class="opt"><input type="checkbox" name="vent_type" value="High flow"> High flow</label>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="#fff" stroke-width="2"/><path d="M7 20h10M9 8h6M9 12h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>เลขเครื่อง <span class="req">*</span></label>
      </div>
      <input type="text" id="machineNo" placeholder="กรอกเลขเครื่อง" required>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="8" stroke="#fff" stroke-width="2"/><path d="M9 2h6M12 2v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>Mode</label>
      </div>
      <div class="opt-grid" id="modeGroup">
        <label class="opt"><input type="radio" name="mode" value="PCV"> PCV</label>
        <label class="opt"><input type="radio" name="mode" value="T-piece"> T-piece</label>
        <label class="opt"><input type="radio" name="mode" value="CMV"> CMV</label>
        <label class="opt"><input type="radio" name="mode" value="ASV"> ASV</label>
        <label class="opt"><input type="radio" name="mode" value="PSIMV"> PSIMV</label>
        <label class="opt"><input type="radio" name="mode" value="__other__"> อื่นๆ:</label>
        <label class="opt"><input type="radio" name="mode" value="Spont"> Spont</label>
        <input type="text" class="other-input" id="modeOther" placeholder="ระบุ Mode">
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 2-7h8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>RR/VT</label>
      </div>
      <input type="text" id="rrVt" placeholder="กรอกค่า RR/VT (เช่น 18/450)">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3c-2 3-2 6-2 9a5 5 0 0 0 5 5c1.5 0 2-1 2-2v-8M17 3c2 3 2 6 2 9a5 5 0 0 1-5 5c-1.5 0-2-1-2-2v-1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>volume</label>
      </div>
      <input type="text" id="volume" placeholder="กรอกค่า volume (เช่น 450 mL)">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#fff" stroke-width="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>วันที่ครบเปลี่ยน</label>
      </div>
      <input type="date" id="dueDate">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v13H7l-3 3V4z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>หมายเหตุ</label>
      </div>
      <textarea id="notes" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="actions">
      <button type="submit" class="btn btn-submit" id="submitBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ส่งข้อมูล
      </button>
      <button type="button" class="btn btn-reset" id="resetBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ล้างแบบฟอร์ม
      </button>
    </div>

  </form>

  <div class="footer-note">
    <p class="quote">"เครื่องพร้อม หายใจปลอดภัย ผู้ป่วยมั่นใจ ทีมงานอุ่นใจ"</p>
    <p>จัดทำโดย ศูนย์เครื่องมือแพทย์</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xbwrawrdnygcfctnxezq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhid3Jhd3JkbnlnY2ZjdG54ZXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzE3MzUsImV4cCI6MjEwNTU0NzczNX0.CgPsQ19JBw-4QzwWiuCxYB3p0mmlPsF2CxA7rmJDKdA";

const form = document.getElementById('roundForm');
const statusMsg = document.getElementById('statusMsg');
const submitBtn = document.getElementById('submitBtn');
const wardOther = document.getElementById('wardOther');
const modeOther = document.getElementById('modeOther');

function toggleOther(groupSelector, otherInput, otherValue){
  document.querySelectorAll(groupSelector).forEach(function(radio){
    radio.addEventListener('change', function(){
      if(radio.value === otherValue && radio.checked){
        otherInput.focus();
      }
    });
  });
}
toggleOther('#wardGroup input[name=ward]', wardOther, '__other__');
toggleOther('#modeGroup input[name=mode]', modeOther, '__other__');

function formatThaiDate(isoDate){
  if(!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  const beYear = (d.getFullYear() + 543) % 100;
  return `${d.getDate()}/${d.getMonth()+1}/${beYear}`;
}

function showStatus(kind, text){
  statusMsg.className = 'status-msg show ' + kind;
  statusMsg.textContent = text;
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  statusMsg.className = 'status-msg';

  const wardRadio = form.querySelector('input[name=ward]:checked');
  const modeRadio = form.querySelector('input[name=mode]:checked');
  const ventChecks = Array.from(form.querySelectorAll('input[name=vent_type]:checked'));
  const machineNo = document.getElementById('machineNo').value.trim();
  const bedNo = document.getElementById('bedNo').value.trim();

  if(!wardRadio || (wardRadio.value === '__other__' && !wardOther.value.trim())){
    showStatus('err', 'กรุณาเลือกหรือระบุหน่วยงาน'); return;
  }
  if(!bedNo){
    showStatus('err', 'กรุณากรอกหมายเลขเตียง'); return;
  }
  if(ventChecks.length === 0){
    showStatus('err', 'กรุณาเลือกเครื่องช่วยหายใจอย่างน้อย 1 รายการ'); return;
  }
  if(!machineNo){
    showStatus('err', 'กรุณากรอกเลขเครื่อง'); return;
  }
  if(modeRadio && modeRadio.value === '__other__' && !modeOther.value.trim()){
    showStatus('err', 'กรุณาระบุ Mode อื่นๆ'); return;
  }

  const ward = wardRadio.value === '__other__' ? wardOther.value.trim() : wardRadio.value;
  const mode = !modeRadio ? null : (modeRadio.value === '__other__' ? modeOther.value.trim() : modeRadio.value);
  const ventType = ventChecks.map(function(c){ return c.value; }).join(', ');
  const now = new Date();

  const payload = {
    recorded_at: now.toISOString(),
    round_date: now.toISOString().slice(0,10),
    ward: ward,
    ward_raw: ward,
    bed: bedNo,
    vent_type: ventType,
    vent_type_raw: ventType,
    machine_no: machineNo,
    mode: mode,
    rr_vt: document.getElementById('rrVt').value.trim() || null,
    volume: document.getElementById('volume').value.trim() || null,
    due_change_date: formatThaiDate(document.getElementById('dueDate').value) || null,
    notes: document.getElementById('notes').value.trim() || null
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังส่งข้อมูล...';

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ventilator_rounds`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error(errText || res.statusText);
    }
    showStatus('ok', 'บันทึกข้อมูลสำเร็จ ขอบคุณค่ะ');
    form.reset();
  }catch(err){
    showStatus('err', 'ส่งข้อมูลไม่สำเร็จ: ' + err.message);
  }finally{
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> ส่งข้อมูล';
  }
});

document.getElementById('resetBtn').addEventListener('click', function(){
  form.reset();
  statusMsg.className = 'status-msg';
});
</script>
</body>
</html>
