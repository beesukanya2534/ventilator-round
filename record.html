<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round Ventilator - บันทึกข้อมูล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink-900:#C2185B;
  --pink-700:#E0508A;
  --pink-600:#EC6FA0;
  --pink-500:#F48FB6;
  --pink-300:#FBC6DC;
  --pink-100:#FDE6EF;
  --pink-050:#FFF4F9;
  --ink:#5B2340;
  --ink-soft:#8A4B69;
  --border:#F5C9DD;
  --white:#FFFFFF;
  --good:#1E8E5A;
  --bad:#D23F6B;
  --shadow: 0 2px 4px rgba(194,24,91,0.06), 0 10px 28px rgba(194,24,91,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg, var(--pink-050) 0%, #FFFBFD 260px);
  color:var(--ink);
  font-family:'Sarabun', sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
a{color:inherit;}

/* ===== Header ===== */
.header{
  background:linear-gradient(120deg, var(--pink-700) 0%, var(--pink-600) 55%, var(--pink-500) 100%);
  color:#fff;
  padding:30px 24px 60px;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:"";
  position:absolute; left:-40px; bottom:-60px;
  width:220px;height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
}
.header::after{
  content:"";
  position:absolute; right:-30px; top:-50px;
  width:260px;height:260px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.16) 0%, transparent 70%);
}
.header-inner{
  max-width:900px; margin:0 auto; position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{
  width:54px;height:54px; border-radius:16px;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.brand h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-0.01em;}
.brand .sub{margin:4px 0 0; font-size:13.5px; color:rgba(255,255,255,0.85); font-weight:500;}
.badge-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.badge-pill{
  font-size:11px; font-weight:700; letter-spacing:0.04em;
  background:rgba(255,255,255,0.2); color:#fff;
  padding:4px 10px; border-radius:20px;
}
.dash-link{
  align-self:flex-start;
  background:#fff; color:var(--pink-900); text-decoration:none;
  font-weight:700; font-size:12.5px;
  padding:9px 16px; border-radius:10px;
  box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:6px;
}
.dash-link:hover{background:var(--pink-100);}

/* ===== Layout ===== */
.wrap{max-width:900px; margin:-32px auto 0; padding:0 24px; position:relative; z-index:2;}
form{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width: 760px){ form{grid-template-columns:1fr;} }
.full{grid-column:1 / -1;}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:20px 22px;
}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.icon-badge{
  width:34px;height:34px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg, var(--pink-600), var(--pink-500));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(224,80,138,0.35);
}
.icon-badge svg{width:18px;height:18px;}
.card-head label{font-size:15px; font-weight:700; color:var(--pink-900);}
.req{color:var(--bad); font-weight:700;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;}
.opt{
  display:flex; align-items:center; gap:9px;
  font-size:14px; color:var(--ink); cursor:pointer;
  padding:4px 2px;
}
.opt input{width:17px;height:17px; accent-color:var(--pink-700); cursor:pointer; flex-shrink:0;}
.other-input{
  grid-column:1 / -1;
  margin-top:2px;
  width:100%;
  border:1.5px solid var(--border);
  border-radius:9px;
  padding:8px 12px;
  font-family:'Sarabun',sans-serif;
  font-size:13.5px;
  color:var(--ink);
  outline:none;
}
.other-input:focus{border-color:var(--pink-600);}

input[type=text], input[type=date], textarea{
  width:100%;
  border:1.5px solid var(--border);
  border-radius:11px;
  padding:12px 14px;
  font-family:'Sarabun',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  outline:none;
  background:var(--pink-050);
}
input[type=text]:focus, input[type=date]:focus, textarea:focus{
  border-color:var(--pink-600);
  background:#fff;
}
textarea{resize:vertical; min-height:70px;}
::placeholder{color:#C98AA6;}

.actions{
  grid-column:1 / -1;
  display:flex; gap:14px; flex-wrap:wrap; margin-top:6px;
}
.btn{
  border:none; cursor:pointer;
  font-family:'Sarabun',sans-serif; font-weight:700; font-size:15px;
  padding:15px 28px; border-radius:14px;
  display:inline-flex; align-items:center; gap:9px;
}
.btn-submit{
  background:linear-gradient(135deg, var(--pink-700), var(--pink-500));
  color:#fff;
  box-shadow:0 6px 16px rgba(194,24,91,0.35);
}
.btn-submit:hover{filter:brightness(1.04);}
.btn-submit:disabled{opacity:0.6; cursor:default;}
.btn-reset{
  background:#fff; color:var(--pink-700);
  border:1.5px solid var(--pink-500);
}
.btn-reset:hover{background:var(--pink-100);}

.status-msg{
  grid-column:1 / -1;
  border-radius:12px;
  padding:12px 16px;
  font-size:13.5px;
  font-weight:600;
  display:none;
}
.status-msg.show{display:block;}
.status-msg.ok{background:#E8F7EF; color:var(--good); border:1px solid #BFE8D1;}
.status-msg.err{background:#FDECEF; color:var(--bad); border:1px solid #F5C0CD;}

.footer-note{
  max-width:900px; margin:34px auto 0; padding:0 24px;
  text-align:center; color:var(--ink-soft); font-size:12.5px;
}
.footer-note .quote{font-weight:700; color:var(--pink-800); margin-bottom:4px; font-size:13.5px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M2 12h4l2-7 4 14 2-7h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Round Ventilator</h1>
        <p class="sub">ร่วมดูแล...เพื่อการหายใจที่ดีกว่า</p>
        <div class="badge-row">
          <span class="badge-pill">CHECK</span>
          <span class="badge-pill">CARE</span>
          <span class="badge-pill">SAFETY</span>
          <span class="badge-pill">TOGETHER</span>
        </div>
      </div>
    </div>
    <a href="index.html" class="dash-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      ดูแดชบอร์ด
    </a>
  </div>
</div>

<div class="wrap">
  <form id="roundForm">

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>หน่วยงาน <span class="req">*</span></label>
      </div>
      <div class="opt-grid" id="wardGroup">
        <label class="opt"><input type="radio" name="ward" value="ICU100" required> ICU100</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลย์ ชาย"> ศัลย์ ชาย</label>
        <label class="opt"><input type="radio" name="ward" value="Semi ICU"> Semi ICU</label>
        <label class="opt"><input type="radio" name="ward" value="Med ชาย"> Med ชาย</label>
        <label class="opt"><input type="radio" name="ward" value="Med ญ"> Med ญ</label>
        <label class="opt"><input type="radio" name="ward" value="กจ3"> กจ3</label>
        <label class="opt"><input type="radio" name="ward" value="EENT"> EENT</label>
        <label class="opt"><input type="radio" name="ward" value="กจ2"> กจ2</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลย์ หญิง"> ศัลย์ หญิง</label>
        <label class="opt"><input type="radio" name="ward" value="TM"> TM</label>
        <label class="opt"><input type="radio" name="ward" value="ศัลยกรรมกระดูก"> ศัลยกรรมกระดูก</label>
        <label class="opt"><input type="radio" name="ward" value="__other__"> อื่นๆ:</label>
        <input type="text" class="other-input" id="wardOther" placeholder="ระบุหน่วยงาน">
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3c-2 3-2 6-2 9a5 5 0 0 0 5 5c1.5 0 2-1 2-2v-8M17 3c2 3 2 6 2 9a5 5 0 0 1-5 5c-1.5 0-2-1-2-2v-1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>เครื่องช่วยหายใจ <span class="req">*</span></label>
      </div>
      <div class="opt-grid" id="ventGroup">
        <label class="opt"><input type="checkbox" name="vent_type" value="C2"> C2</label>
        <label class="opt"><input type="checkbox" name="vent_type" value="Bird"> Bird</label>
        <label class="opt"><input type="checkbox" name="vent_type" value="High flow"> High flow</label>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="#fff" stroke-width="2"/><path d="M7 20h10M9 8h6M9 12h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>เลขเครื่อง <span class="req">*</span></label>
      </div>
      <input type="text" id="machineNo" placeholder="กรอกเลขเครื่อง" required>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="8" stroke="#fff" stroke-width="2"/><path d="M9 2h6M12 2v3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>Mode <span class="req">*</span></label>
      </div>
      <div class="opt-grid" id="modeGroup">
        <label class="opt"><input type="radio" name="mode" value="PCV" required> PCV</label>
        <label class="opt"><input type="radio" name="mode" value="T-piece"> T-piece</label>
        <label class="opt"><input type="radio" name="mode" value="CMV"> CMV</label>
        <label class="opt"><input type="radio" name="mode" value="ASV"> ASV</label>
        <label class="opt"><input type="radio" name="mode" value="PSIMV"> PSIMV</label>
        <label class="opt"><input type="radio" name="mode" value="__other__"> อื่นๆ:</label>
        <label class="opt"><input type="radio" name="mode" value="Spont"> Spont</label>
        <input type="text" class="other-input" id="modeOther" placeholder="ระบุ Mode">
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 2-7h8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>RR/VT</label>
      </div>
      <input type="text" id="rrVt" placeholder="กรอกค่า RR/VT (เช่น 18/450)">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3c-2 3-2 6-2 9a5 5 0 0 0 5 5c1.5 0 2-1 2-2v-8M17 3c2 3 2 6 2 9a5 5 0 0 1-5 5c-1.5 0-2-1-2-2v-1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <label>volume</label>
      </div>
      <input type="text" id="volume" placeholder="กรอกค่า volume (เช่น 450 mL)">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#fff" stroke-width="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>วันที่ครบเปลี่ยน</label>
      </div>
      <input type="date" id="dueDate">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v13H7l-3 3V4z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <label>หมายเหตุ</label>
      </div>
      <textarea id="notes" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="actions">
      <button type="submit" class="btn btn-submit" id="submitBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ส่งข้อมูล
      </button>
      <button type="button" class="btn btn-reset" id="resetBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12a9 9 0 1 1-3-6.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ล้างแบบฟอร์ม
      </button>
    </div>

  </form>

  <div class="footer-note">
    <p class="quote">"เครื่องพร้อม หายใจปลอดภัย ผู้ป่วยมั่นใจ ทีมงานอุ่นใจ"</p>
    <p>จัดทำโดย ศูนย์เครื่องมือแพทย์</p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xbwrawrdnygcfctnxezq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhid3Jhd3JkbnlnY2ZjdG54ZXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzE3MzUsImV4cCI6MjEwNTU0NzczNX0.CgPsQ19JBw-4QzwWiuCxYB3p0mmlPsF2CxA7rmJDKdA";

const form = document.getElementById('roundForm');
const statusMsg = document.getElementById('statusMsg');
const submitBtn = document.getElementById('submitBtn');
const wardOther = document.getElementById('wardOther');
const modeOther = document.getElementById('modeOther');

function toggleOther(groupSelector, otherInput, otherValue){
  document.querySelectorAll(groupSelector).forEach(function(radio){
    radio.addEventListener('change', function(){
      if(radio.value === otherValue && radio.checked){
        otherInput.focus();
      }
    });
  });
}
toggleOther('#wardGroup input[name=ward]', wardOther, '__other__');
toggleOther('#modeGroup input[name=mode]', modeOther, '__other__');

function formatThaiDate(isoDate){
  if(!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00');
  const beYear = (d.getFullYear() + 543) % 100;
  return `${d.getDate()}/${d.getMonth()+1}/${beYear}`;
}

function showStatus(kind, text){
  statusMsg.className = 'status-msg show ' + kind;
  statusMsg.textContent = text;
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  statusMsg.className = 'status-msg';

  const wardRadio = form.querySelector('input[name=ward]:checked');
  const modeRadio = form.querySelector('input[name=mode]:checked');
  const ventChecks = Array.from(form.querySelectorAll('input[name=vent_type]:checked'));
  const machineNo = document.getElementById('machineNo').value.trim();

  if(!wardRadio || (wardRadio.value === '__other__' && !wardOther.value.trim())){
    showStatus('err', 'กรุณาเลือกหรือระบุหน่วยงาน'); return;
  }
  if(ventChecks.length === 0){
    showStatus('err', 'กรุณาเลือกเครื่องช่วยหายใจอย่างน้อย 1 รายการ'); return;
  }
  if(!machineNo){
    showStatus('err', 'กรุณากรอกเลขเครื่อง'); return;
  }
  if(!modeRadio || (modeRadio.value === '__other__' && !modeOther.value.trim())){
    showStatus('err', 'กรุณาเลือกหรือระบุ Mode'); return;
  }

  const ward = wardRadio.value === '__other__' ? wardOther.value.trim() : wardRadio.value;
  const mode = modeRadio.value === '__other__' ? modeOther.value.trim() : modeRadio.value;
  const ventType = ventChecks.map(function(c){ return c.value; }).join(', ');
  const now = new Date();

  const payload = {
    recorded_at: now.toISOString(),
    round_date: now.toISOString().slice(0,10),
    ward: ward,
    ward_raw: ward,
    vent_type: ventType,
    vent_type_raw: ventType,
    machine_no: machineNo,
    mode: mode,
    rr_vt: document.getElementById('rrVt').value.trim() || null,
    volume: document.getElementById('volume').value.trim() || null,
    due_change_date: formatThaiDate(document.getElementById('dueDate').value) || null,
    notes: document.getElementById('notes').value.trim() || null
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังส่งข้อมูล...';

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ventilator_rounds`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error(errText || res.statusText);
    }
    showStatus('ok', 'บันทึกข้อมูลสำเร็จ ขอบคุณค่ะ');
    form.reset();
  }catch(err){
    showStatus('err', 'ส่งข้อมูลไม่สำเร็จ: ' + err.message);
  }finally{
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> ส่งข้อมูล';
  }
});

document.getElementById('resetBtn').addEventListener('click', function(){
  form.reset();
  statusMsg.className = 'status-msg';
});
</script>
</body>
</html>
